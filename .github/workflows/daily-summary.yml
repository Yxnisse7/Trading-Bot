name: Trading bot — résumé quotidien

# 22:05 UTC = 00:05 Paris (été) / 23:05 (hiver). Ajustez selon vos besoins.
on:
  schedule:
    - cron: "5 22 * * *"
  workflow_dispatch:

concurrency:
  group: trading-bot-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Résumé quotidien
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python run.py summary | tee data/last_summary.txt
      - name: Sauvegarder
        run: |
          git config user.name "trading-bot[actions]"
          git config user.email "actions@users.noreply.github.com"
          git add data/ docs/dashboard.json 2>/dev/null || git add data/
          git diff --cached --quiet && exit 0
          git commit -m "bot: résumé quotidien $(date -u +'%Y-%m-%d')"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin HEAD:"${GITHUB_REF_NAME}" && exit 0
            sleep $((2 ** i))
          done
          exit 1
