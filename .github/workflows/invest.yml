name: Investissement halal — mise à jour

# Chaque jour à 06:30 UTC (et à la main) : historique mensuel des ETF islamiques, sukuk et or,
# statistiques de long terme, avis par règles et actualités, publiés pour l'onglet « Investir ».
# Aucun ordre, aucun message Telegram.
on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

concurrency:
  group: trading-bot-invest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  invest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Données d'investissement
        run: bash scripts/run_and_push.sh python run.py invest
