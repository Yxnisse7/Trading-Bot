name: Trading bot — résumé quotidien

# 22:05 UTC = 00:05 Paris (été) / 23:05 (hiver). Ajustez selon vos besoins.
on:
  schedule:
    - cron: "5 22 * * *"
  workflow_dispatch:

concurrency:
  group: trading-bot-summary
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Résumé quotidien
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: bash scripts/run_and_push.sh python run.py summary
