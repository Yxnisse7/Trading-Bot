name: Trading bot — tick (suivi + scan)

# Toutes les 5 minutes (dépôt public : minutes illimitées) : commandes Telegram, suivi des
# signaux ouverts (TP / SL / expiration), puis scan toutes les ~15 min.
# Le planificateur GitHub étant capricieux, un cron externe (cron-job.org) déclenche aussi
# ce workflow via workflow_dispatch ; les deux peuvent coexister.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "Commande (tick, scan, track, test-notify, backtest, fetch-data, manual, propose)"
        default: "tick"
      asset:
        description: "Actif pour `manual` / `propose` (nasdaq, sp500, bitcoin, ethereum, gold)"
        required: false
      direction:
        description: "Sens pour `manual` (long ou short)"
        required: false
      note:
        description: "Commentaire pour `manual`"
        required: false

concurrency:
  group: trading-bot-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Exécuter le bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CMD: ${{ github.event.inputs.command || 'tick' }}
          ASSET: ${{ github.event.inputs.asset }}
          DIRECTION: ${{ github.event.inputs.direction }}
          NOTE: ${{ github.event.inputs.note }}
        run: |
          case "$CMD" in
            fetch-data) python run.py fetch-data --days 60 ;;
            manual)     python run.py manual --asset "$ASSET" --direction "$DIRECTION" --note "$NOTE" ;;
            propose)    python run.py propose --asset "$ASSET" ;;
            *)          python run.py "$CMD" ;;
          esac
      - name: Sauvegarder l'état (signaux, historique, apprentissage)
        run: |
          git config user.name "trading-bot[actions]"
          git config user.email "actions@users.noreply.github.com"
          git add data/ docs/dashboard.json 2>/dev/null || git add data/
          if git diff --cached --quiet; then
            echo "Aucun changement d'état."
            exit 0
          fi
          git commit -m "bot: état $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin HEAD:"${GITHUB_REF_NAME}" && exit 0
            sleep $((2 ** i))
          done
          exit 1
