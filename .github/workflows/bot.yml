name: Trading bot — tick (suivi + scan)

# Toutes les 5 minutes : suit les signaux ouverts (TP / SL / expiration) et,
# si ~15 min se sont écoulées depuis le dernier scan, cherche de nouveaux signaux.
# GitHub Actions exécute les crons "au mieux" : quelques minutes de retard sont normales.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "Commande à exécuter (tick, scan, track)"
        default: "tick"

concurrency:
  group: trading-bot-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Exécuter le bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python run.py ${{ github.event.inputs.command || 'tick' }}
      - name: Sauvegarder l'état (signaux, historique, apprentissage)
        run: |
          git config user.name "trading-bot[actions]"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Aucun changement d'état."
            exit 0
          fi
          git commit -m "bot: état $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin HEAD:"${GITHUB_REF_NAME}" && exit 0
            sleep $((2 ** i))
          done
          exit 1
