name: Trading bot — tick (suivi + scan)

# Toutes les 5 minutes (dépôt public : minutes illimitées) : commandes Telegram, suivi des
# signaux ouverts (TP / SL / expiration), puis recherche de signaux à chaque passage.
# Le planificateur GitHub étant capricieux, un cron externe (cron-job.org) déclenche aussi
# ce workflow via workflow_dispatch ; les deux peuvent coexister.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "Commande (tick, scan, track, guide, test-notify, backtest, fetch-data, manual, propose, portfolio, stop)"
        default: "tick"
      asset:
        description: "Actif pour `manual` / `propose` (nasdaq, sp500, bitcoin, ethereum, gold)"
        required: false
      direction:
        description: "Sens pour `manual` (long ou short)"
        required: false
      note:
        description: "Commentaire pour `manual`"
        required: false
      tp:
        description: "Objectif imposé pour `manual` (facultatif : sinon calibré par le bot)"
        required: false
      sl:
        description: "Stop imposé pour `manual` (facultatif : sinon calibré par le bot)"
        required: false
      balance:
        description: "Nouvelle balance de simulation pour `portfolio`"
        required: false
      risk:
        description: "Risque par trade en % pour `portfolio` (facultatif)"
        required: false
      signal:
        description: "Trade à arrêter pour `stop` (identifiant ou actif ; vide = le seul trade ouvert)"
        required: false

# Les passages planifiés (tick) partagent un groupe : un tick en attente peut être remplacé par le
# suivant, sans perte. Les demandes de l'utilisateur (manual, propose, portfolio…) ont chacune leur
# propre groupe : elles ne sont jamais annulées.
concurrency:
  group: ${{ contains(fromJSON('["", "tick"]'), github.event.inputs.command || '') && 'trading-bot-tick' || format('trading-bot-run-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Exécuter le bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CMD: ${{ github.event.inputs.command || 'tick' }}
          ASSET: ${{ github.event.inputs.asset }}
          DIRECTION: ${{ github.event.inputs.direction }}
          NOTE: ${{ github.event.inputs.note }}
          TP: ${{ github.event.inputs.tp }}
          SL: ${{ github.event.inputs.sl }}
          BALANCE: ${{ github.event.inputs.balance }}
          RISK: ${{ github.event.inputs.risk }}
          SIGNAL: ${{ github.event.inputs.signal }}
        run: |
          case "$CMD" in
            fetch-data) bash scripts/run_and_push.sh python run.py fetch-data --days 60 ;;
            manual)     ARGS=""
                        if [ -n "$TP" ]; then ARGS="$ARGS --tp $TP"; fi
                        if [ -n "$SL" ]; then ARGS="$ARGS --sl $SL"; fi
                        bash scripts/run_and_push.sh python run.py manual --asset "$ASSET" --direction "$DIRECTION" --note "$NOTE" $ARGS ;;
            propose)    bash scripts/run_and_push.sh python run.py propose --asset "$ASSET" ;;
            stop)       bash scripts/run_and_push.sh python run.py stop --signal "$SIGNAL" ;;
            portfolio)  if [ -n "$RISK" ]; then bash scripts/run_and_push.sh python run.py portfolio --balance "$BALANCE" --risk "$RISK"; else bash scripts/run_and_push.sh python run.py portfolio --balance "$BALANCE"; fi ;;
            *)          bash scripts/run_and_push.sh python run.py "$CMD" ;;
          esac
      # Mode halal : second bot entièrement séparé (données dans data/halal, page halal.html, messages 🌙).
      # Étape indépendante : si elle échoue, le bot principal (déjà enregistré ci-dessus) n'est pas touché.
      - name: Mode halal (bot séparé)
        if: ${{ (github.event.inputs.command || 'tick') == 'tick' }}
        continue-on-error: true
        timeout-minutes: 4
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TRADING_BOT_DATA_DIR: data/halal
          TRADING_BOT_OUTBOX: ${{ runner.temp }}/outbox-halal.jsonl
        run: bash scripts/run_and_push.sh python run.py --halal tick
