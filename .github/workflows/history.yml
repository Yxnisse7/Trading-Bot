name: Historique long (backtest des setups)

# À la main : télécharge des mois de bougies 5 min (Binance pour les cryptos, Dukascopy pour les
# indices, l'or, le pétrole et l'euro), vérifie leur cohérence, et les garde dans la release
# « history » (jamais dans le dépôt). Sert à tester les nouveaux setups sur bien plus que 60 jours.
on:
  workflow_dispatch:
    inputs:
      months:
        description: "Profondeur en mois"
        default: "12"

permissions:
  contents: write

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Téléchargement et contrôle
        run: python run.py fetch-history --months "${{ inputs.months }}"
      - name: Release « history »
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar czf "$RUNNER_TEMP/history.tar.gz" -C data/history .
          ls -la "$RUNNER_TEMP/history.tar.gz"
          gh release view history >/dev/null 2>&1 || gh release create history --prerelease \
            --title "Historique long 5 min" \
            --notes "Bougies 5 min sur plusieurs mois (Binance, Dukascopy CFD) pour tester les setups. Données publiques."
          gh release upload history "$RUNNER_TEMP/history.tar.gz" --clobber
