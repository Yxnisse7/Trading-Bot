name: Trading bot — commandes Telegram

# Passage léger (quelques secondes) : lit les commandes Telegram reçues et y répond.
# À déclencher par un cron externe toutes les 1 à 2 minutes (workflow_dispatch, corps {"ref":"main"}).
on:
  workflow_dispatch:

concurrency:
  group: trading-bot-commands
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  commands:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Traiter les commandes
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: bash scripts/run_and_push.sh python run.py commands
