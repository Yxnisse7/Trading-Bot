name: Trading bot — commandes Telegram

# Passage léger (quelques secondes) : lit les commandes Telegram reçues et y répond.
# À déclencher par un cron externe toutes les 1 à 2 minutes (workflow_dispatch, corps {"ref":"main"}).
on:
  workflow_dispatch:

concurrency:
  group: trading-bot-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  commands:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Traiter les commandes
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python run.py commands
      - name: Sauvegarder l'état
        run: |
          git config user.name "trading-bot[actions]"
          git config user.email "actions@users.noreply.github.com"
          git add data/ docs/dashboard.json docs/portfolio.json 2>/dev/null || git add data/
          git diff --cached --quiet && exit 0
          git commit -m "bot: commandes $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin HEAD:"${GITHUB_REF_NAME}" && exit 0
            sleep $((2 ** i))
          done
          exit 1
